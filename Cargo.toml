[workspace]
resolver = "2"
exclude = ["vendor/*"]
members = [
    "crates/clipsync-protocol",
    "crates/clipsync-crypto",
    "crates/clipsync-storage",
    "crates/clipsync-clipboard",
    "crates/clipsync-transport",
    "crates/clipsync-transfer",
    "crates/clipsync-core",
    "crates/clipsync-daemon",
    "crates/clipsync-cli",
    "crates/clipsync-relay",
    "crates/clipsync-mobile",
    "crates/clipsync-desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["ClipSync contributors"]
repository = "https://github.com/Jeon1691/clipsync"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
arboard = { version = "3.7", features = ["image-data", "wayland-data-control"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros", "json"] }
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6"
directories = "6"
# Keep both graphics backends and native accessibility. Select the existing
# Crossfont title renderer below instead of winit's default ab_glyph renderer.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit", "clipboard", "default_fonts", "glow", "links",
    "wayland", "web_screen_reader", "wgpu", "x11",
] }
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-crossfont",
] }
futures-util = "0.3"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
infer = "0.19"
ipnet = "2"
keyring = { version = "3.6", default-features = false }
parking_lot = "0.13"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "http2",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
    "macos-system-configuration",
] }
# Advisory `flock` for the replay-state lock. std's `File::lock` returns
# `Unsupported` on Android before Rust 1.98, above the workspace MSRV.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snow = "0.10"
spake2 = "0.4"
subtle = "2"
tempfile = "3"
thiserror = "2"
# UTC instants (`clipsync_protocol::Timestamp`). 0.3.47 fixes RUSTSEC-2026-0009.
# `large-dates` covers chrono's former year range (+-262143), which released
# peers and existing state files can contain; serde is implemented in-tree to
# keep chrono's exact RFC 3339 spelling.
time = { version = "0.3.47", default-features = false, features = ["std", "large-dates"] }
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = [
    "connect",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
toml = "1.2"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
ulid = { version = "3", features = ["serde"] }
uniffi = "0.32.2"
url = "2"
which = "8"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom", "zeroize"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

clipsync-protocol = { path = "crates/clipsync-protocol" }
clipsync-crypto = { path = "crates/clipsync-crypto" }
clipsync-storage = { path = "crates/clipsync-storage" }
clipsync-clipboard = { path = "crates/clipsync-clipboard" }
clipsync-transport = { path = "crates/clipsync-transport" }
clipsync-transfer = { path = "crates/clipsync-transfer" }
clipsync-core = { path = "crates/clipsync-core" }
clipsync-daemon = { path = "crates/clipsync-daemon" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

# Compatibility patches are source distributions with documented local maintenance.
# See vendor/README.md for upstream provenance, exact scope and retirement criteria.
[patch.crates-io]
askama_derive = { path = "vendor/askama_derive" }
uniffi_internal_macros = { path = "vendor/uniffi_internal_macros" }
accesskit_unix = { path = "vendor/accesskit_unix" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
atspi-common = { path = "vendor/atspi-common" }
atspi-proxies = { path = "vendor/atspi-proxies" }
zbus-lockstep = { path = "vendor/zbus-lockstep" }
zbus-lockstep-macros = { path = "vendor/zbus-lockstep-macros" }
