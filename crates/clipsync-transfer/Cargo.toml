[package]
name = "clipsync-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ClipSync chunked transfer, staging, and integrity"

[dependencies]
blake3.workspace = true
clipsync-crypto.workspace = true
clipsync-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
ulid.workspace = true

# Advisory `flock` for the inbox publish lock. std's `File::lock` returns
# `Unsupported` on Android before Rust 1.98, above the workspace MSRV.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
