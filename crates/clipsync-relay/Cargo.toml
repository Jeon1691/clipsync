[package]
name = "clipsync-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ClipSync zero-knowledge WebSocket relay"

[lib]
name = "clipsync_relay"
path = "src/lib.rs"

[[bin]]
name = "clipsync-relay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-ring"] }
clap.workspace = true
base64.workspace = true
chrono.workspace = true
clipsync-protocol.workspace = true
dashmap.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
ipnet.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
clipsync-core.workspace = true
clipsync-clipboard.workspace = true
clipsync-crypto.workspace = true
clipsync-protocol.workspace = true
clipsync-storage.workspace = true
clipsync-transfer.workspace = true
image.workspace = true

[lints]
workspace = true
