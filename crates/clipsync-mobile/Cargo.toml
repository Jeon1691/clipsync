[package]
name = "clipsync-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "UniFFI bindings for native iOS and Android ClipSync apps"

[lib]
name = "clipsync_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
async-trait.workspace = true
clipsync-clipboard.workspace = true
clipsync-core.workspace = true
clipsync-protocol.workspace = true
clipsync-storage.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi = { workspace = true, features = ["cli"] }

[dev-dependencies]
clipsync-crypto.workspace = true
serde_json.workspace = true
tempfile.workspace = true
axum.workspace = true
clipsync-relay = { path = "../clipsync-relay" }
tracing-subscriber.workspace = true

[lints]
workspace = true
