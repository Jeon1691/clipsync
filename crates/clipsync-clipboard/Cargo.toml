[package]
name = "clipsync-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ClipSync OS clipboard adapters"

[dependencies]
arboard.workspace = true
async-trait.workspace = true
clipsync-protocol.workspace = true
image.workspace = true
infer.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
which.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSValue", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSImage"] }
