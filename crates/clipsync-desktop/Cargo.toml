[package]
name = "clipsync-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ClipSync desktop app for macOS, Windows, and Linux"

[[bin]]
name = "clipsync-desktop"
path = "src/main.rs"

[dependencies]
clipsync-core.workspace = true
clipsync-daemon.workspace = true
clipsync-storage.workspace = true
eframe.workspace = true
winit.workspace = true
tokio.workspace = true

[dev-dependencies]
# Test builds never mirror secrets into the OS keychain (see clipsync-storage).
clipsync-storage = { workspace = true, features = ["test-isolated-keychain"] }
clipsync-crypto.workspace = true
serde_json.workspace = true
tempfile.workspace = true
axum.workspace = true
clipsync-relay = { path = "../clipsync-relay" }

[lints]
workspace = true
