[package]
name = "clipsync-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ClipSync command-line interface"
default-run = "clipsync"

[[bin]]
name = "clipsync"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clipsync-clipboard.workspace = true
clipsync-core.workspace = true
clipsync-daemon.workspace = true
clipsync-protocol.workspace = true
clipsync-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# Already in the tree (clipsync-relay, clipsync-clipboard). Used for
# `tcflush`, whose queue selector differs between Linux and the BSDs.
libc = "0.2"

[dev-dependencies]
# Test builds never mirror secrets into the OS keychain (see clipsync-storage).
clipsync-storage = { workspace = true, features = ["test-isolated-keychain"] }
clipsync-crypto.workspace = true
axum.workspace = true
clipsync-relay = { path = "../clipsync-relay" }
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
