name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            optional: false
          - os: macos-14
            target: x86_64-apple-darwin
            optional: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            optional: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            optional: true
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            optional: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p clipsync-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          stage="clipsync-${target}"
          mkdir -p "dist/${stage}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="target/${target}/release/clipsync.exe"
            cp "$bin" "dist/${stage}/clipsync.exe"
            cp README.md LICENSE-MIT LICENSE-APACHE "dist/${stage}/"
            (cd dist && powershell -NoProfile -Command "Compress-Archive -Path '${stage}\\*' -DestinationPath '${stage}.zip'")
            (cd dist && sha256sum "${stage}.zip" > "${stage}.sha256" || shasum -a 256 "${stage}.zip" > "${stage}.sha256")
          else
            bin="target/${target}/release/clipsync"
            chmod +x "$bin"
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              strip -x "$bin" || true
              codesign --sign - --force --timestamp=none "$bin" || true
            else
              strip "$bin" || true
            fi
            cp "$bin" "dist/${stage}/clipsync"
            cp README.md LICENSE-MIT LICENSE-APACHE "dist/${stage}/"
            tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
            (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clipsync-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clipsync-x86_64-unknown-linux-gnu
          path: dist
      - name: Run packaged Linux binary
        run: |
          set -euo pipefail
          tar -xzf dist/clipsync-x86_64-unknown-linux-gnu.tar.gz
          bin="$(find . -type f -name clipsync | head -1)"
          chmod +x "$bin"
          "$bin" --version
          "$bin" --help | grep -q "Usage: clipsync"

  publish:
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cat artifacts/*.sha256
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          assets=(artifacts/*.tar.gz artifacts/*.zip artifacts/*.sha256)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release assets" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_DEPLOY_KEY}" ]]; then
            echo "TAP_DEPLOY_KEY not set; skipping tap update"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy
          chmod 600 ~/.ssh/tap_deploy
          cat >> ~/.ssh/config <<EOF
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/tap_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy -o IdentitiesOnly=yes" \
            bash scripts/update-homebrew-formula.sh
