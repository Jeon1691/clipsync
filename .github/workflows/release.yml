name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            optional: false
          - os: macos-14
            target: x86_64-apple-darwin
            optional: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            optional: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p clipsync-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bin="target/${target}/release/clipsync"
          chmod +x "$bin"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            strip -x "$bin" || true
            codesign --sign - --force --timestamp=none "$bin" || true
          else
            strip "$bin" || true
          fi
          stage="clipsync-${target}"
          mkdir -p "dist/${stage}"
          cp "$bin" "dist/${stage}/clipsync"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
          (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: clipsync-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cat artifacts/*.sha256
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.tar.gz artifacts/*.sha256 --clobber
          else
            gh release create "$tag" artifacts/*.tar.gz artifacts/*.sha256 \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_DEPLOY_KEY}" ]]; then
            echo "TAP_DEPLOY_KEY not set; skipping tap update"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy
          chmod 600 ~/.ssh/tap_deploy
          cat >> ~/.ssh/config <<EOF
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/tap_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy -o IdentitiesOnly=yes" \
            bash scripts/update-homebrew-formula.sh
