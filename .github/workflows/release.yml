name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p clipsync-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bin="target/${target}/release/clipsync"
          chmod +x "$bin"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            strip -x "$bin" || true
            codesign --sign - --force --timestamp=none "$bin" || true
          else
            strip "$bin" || true
          fi
          stage="clipsync-${target}"
          mkdir -p "dist/${stage}"
          cp "$bin" "dist/${stage}/clipsync"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
          (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: clipsync-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cat artifacts/*.sha256
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.tar.gz artifacts/*.sha256 --clobber
          else
            gh release create "$tag" artifacts/*.tar.gz artifacts/*.sha256 \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
      - name: Update Homebrew tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: bash scripts/update-homebrew-formula.sh
