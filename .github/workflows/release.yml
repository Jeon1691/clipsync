# Copyright the ClipSync contributors.
# SPDX-License-Identifier: MIT
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish release assets (select a v* tag; otherwise build and verify only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            optional: false
          - os: macos-15
            target: x86_64-apple-darwin
            optional: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            optional: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            optional: true
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            optional: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p clipsync-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          stage="clipsync-${target}"
          mkdir -p "dist/${stage}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="target/${target}/release/clipsync.exe"
            cp "$bin" "dist/${stage}/clipsync.exe"
            cp README.md LICENSE-MIT "dist/${stage}/"
            (cd dist && powershell -NoProfile -Command "Compress-Archive -Path '${stage}\\*' -DestinationPath '${stage}.zip'")
            (cd dist && sha256sum "${stage}.zip" > "${stage}.sha256" || shasum -a 256 "${stage}.zip" > "${stage}.sha256")
          else
            bin="target/${target}/release/clipsync"
            chmod +x "$bin"
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              strip -x "$bin" || true
              codesign --sign - --force --timestamp=none "$bin" || true
            else
              strip "$bin" || true
            fi
            cp "$bin" "dist/${stage}/clipsync"
            cp README.md LICENSE-MIT "dist/${stage}/"
            tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
            (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.sha256")
          fi
      - name: Attest release archives
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          create-storage-record: false
      - name: Preserve, verify, and export provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="dist/clipsync-${TARGET}.sigstore.json"
          cp "$ATTESTATION_BUNDLE" "$bundle"
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "expected exactly one release archive" >&2
            exit 1
          fi
          python=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then python=python; fi
          "$python" scripts/export-provenance.py "${archives[0]}" \
            --bundle "$bundle" \
            --output "dist/clipsync-${TARGET}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"
          "$python" scripts/export-provenance.py "${archives[0]}" \
            --bundle "$bundle" \
            --output "dist/clipsync-${TARGET}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipsync-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.sigstore.json
            dist/*.intoto.jsonl
          if-no-files-found: error

  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clipsync-x86_64-unknown-linux-gnu
          path: dist
      - name: Run packaged Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/export-provenance.py dist/clipsync-x86_64-unknown-linux-gnu.tar.gz \
            --bundle dist/clipsync-x86_64-unknown-linux-gnu.sigstore.json \
            --output dist/clipsync-x86_64-unknown-linux-gnu.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --check
          tar -xzf dist/clipsync-x86_64-unknown-linux-gnu.tar.gz
          bin="$(find . -type f -name clipsync | head -1)"
          chmod +x "$bin"
          "$bin" --version
          "$bin" --help | grep -q "Usage: clipsync"
      - name: Run verified Linux binary without desktop or DBus libraries
        run: |
          set -euo pipefail
          bin="$(realpath clipsync-x86_64-unknown-linux-gnu/clipsync)"
          docker run --rm --platform linux/amd64 \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=${bin},dst=/clipsync,readonly" \
            --entrypoint /clipsync \
            gcr.io/distroless/cc-debian12:latest@sha256:e5d81ddde149641e2a9ba55be4545bc125c67de07508b03ba4c22e6eb0ded5aa \
            --version

  publish:
    permissions:
      contents: write
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify assets and publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [[ ! -s "$notes" ]]; then
            echo "write a release summary and upgrade impact in $notes before publishing" >&2
            exit 1
          fi
          shopt -s nullglob
          verify_source() {
            local default_branch
            default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
            git check-ref-format "refs/heads/$default_branch"
            git fetch --no-tags origin \
              "refs/heads/$default_branch:refs/remotes/origin/$default_branch" \
              "refs/tags/$tag:refs/tags/$tag"
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "release tag does not identify this workflow's source commit" >&2
              return 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$default_branch"; then
              echo "release source must be an ancestor of the default branch" >&2
              return 1
            fi
          }
          verify_assets() {
            local directory="$1" archive prefix
            local archives=("$directory"/*.tar.gz "$directory"/*.zip)
            local files=("$directory"/*)
            for archive in \
              clipsync-aarch64-apple-darwin.tar.gz \
              clipsync-x86_64-apple-darwin.tar.gz \
              clipsync-x86_64-unknown-linux-gnu.tar.gz \
              clipsync-x86_64-pc-windows-msvc.zip; do
              test -s "$directory/$archive"
            done
            if [[ ${#files[@]} -ne $((${#archives[@]} * 4)) ]]; then
              echo "expected an archive, checksum, Sigstore bundle, and DSSE export for each target" >&2
              return 1
            fi
            for archive in "${archives[@]}"; do
              case "${archive##*/}" in
                clipsync-aarch64-apple-darwin.tar.gz|clipsync-x86_64-apple-darwin.tar.gz|\
                clipsync-x86_64-unknown-linux-gnu.tar.gz|clipsync-aarch64-unknown-linux-gnu.tar.gz|\
                clipsync-x86_64-pc-windows-msvc.zip) ;;
                *) echo "unexpected release archive: $archive" >&2; return 1 ;;
              esac
              prefix="${archive%.tar.gz}"
              prefix="${prefix%.zip}"
              test -s "$prefix.sha256"
              python3 scripts/verify-release-checksum.py "$archive" "$prefix.sha256"
              python3 scripts/export-provenance.py "$archive" \
                --bundle "$prefix.sigstore.json" \
                --output "$prefix.intoto.jsonl" \
                --repo "$GITHUB_REPOSITORY" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --check
            done
          }
          verify_source
          verify_assets artifacts
          if release="$(gh release view "$tag" --json isDraft,assets,tagName,targetCommitish)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release")" != "true" ]]; then
              echo "release $tag is already published; refusing to change its assets" >&2
              exit 1
            fi
            if [[ "$(jq -r '.tagName' <<< "$release")" != "$tag" || \
                  "$(jq -r '.targetCommitish' <<< "$release")" != "$GITHUB_SHA" ]]; then
              echo "draft $tag does not identify this exact tag and source commit" >&2
              exit 1
            fi
            if [[ "$(jq '.assets | length' <<< "$release")" != "0" ]]; then
              echo "draft $tag already has assets; inspect it before retrying without overwriting evidence" >&2
              exit 1
            fi
          else
            gh release create "$tag" --draft \
              --title "$tag" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" \
              --verify-tag
          fi
          gh release upload "$tag" artifacts/*
          uploaded="$(mktemp -d "$RUNNER_TEMP/clipsync-uploaded.XXXXXX")"
          gh release download "$tag" --dir "$uploaded"
          diff -qr artifacts "$uploaded"
          verify_assets "$uploaded"
          verify_source
          gh release edit "$tag" --draft=false
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_DEPLOY_KEY}" ]]; then
            echo "TAP_DEPLOY_KEY not set; skipping tap update"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy
          chmod 600 ~/.ssh/tap_deploy
          cat >> ~/.ssh/config <<EOF
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/tap_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy -o IdentitiesOnly=yes" \
            bash scripts/update-homebrew-formula.sh
