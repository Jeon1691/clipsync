name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux clipboard tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xclip xvfb
      - name: Format
        if: matrix.platform != 'windows'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Workspace tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a cargo test --workspace --locked -- --test-threads=1
          else
            cargo test --workspace --locked
          fi
      - name: Platform contract
        shell: bash
        run: |
          set -euo pipefail
          filter='platform_'
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a cargo test --workspace --locked -- "$filter" --test-threads=1
          else
            cargo test --workspace --locked -- "$filter"
          fi
      - name: Relay e2e
        shell: bash
        run: cargo test -p clipsync-relay --test e2e --locked -- --nocapture
      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p clipsync-cli -p clipsync-relay --locked
          bin="./target/debug/clipsync"
          relay="./target/debug/clipsync-relay"
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          if [[ -f "${relay}.exe" ]]; then relay="${relay}.exe"; fi
          "$bin" --version
          "$bin" --help | grep -q "Usage: clipsync"
          "$relay" --help
      - name: Scripts compile
        if: matrix.platform != 'windows'
        run: |
          python3 -m py_compile scripts/e2e-brew.py
          bash -n scripts/update-homebrew-formula.sh
