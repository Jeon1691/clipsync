name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  msrv:
    name: Minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev
      - name: Check minimum supported Rust version
        run: cargo +1.88.0 check --workspace --all-targets --locked

  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux clipboard tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb libgtk-3-dev libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev
      - name: Source copyright and license notices
        if: matrix.platform != 'windows'
        run: python3 scripts/check-source-headers.py
      - name: Format
        if: matrix.platform != 'windows'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a cargo test --workspace --locked -- --test-threads=1
          else
            cargo test --workspace --locked
          fi
      - name: Regression coverage policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            python scripts/check-regressions.py --verify-tests --platform windows --report target/regression-policy-windows.json
          else
            python3 scripts/check-regressions.py --verify-tests --platform "${{ matrix.platform }}" --report "target/regression-policy-${{ matrix.platform }}.json"
          fi
      - name: Retain regression policy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-policy-${{ matrix.platform }}
          path: target/regression-policy-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Long-run stability
        shell: bash
        run: cargo test --workspace --locked -- stability_
      - name: Platform contract
        shell: bash
        run: |
          set -euo pipefail
          filter='platform_'
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a cargo test --workspace --locked -- "$filter" --test-threads=1
          else
            cargo test --workspace --locked -- "$filter"
          fi
      - name: Relay e2e
        shell: bash
        run: cargo test -p clipsync-relay --test e2e --locked -- --skip format_matrix --nocapture
      - name: Image and file formats
        shell: bash
        run: cargo test -p clipsync-relay --test e2e --locked format_matrix -- --test-threads=1 --nocapture
      - name: Desktop app
        shell: bash
        run: cargo build -p clipsync-desktop --locked
      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p clipsync-cli -p clipsync-relay --locked
          bin="./target/debug/clipsync"
          relay="./target/debug/clipsync-relay"
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          if [[ -f "${relay}.exe" ]]; then relay="${relay}.exe"; fi
          "$bin" --version
          "$bin" --help | grep -q "Usage: clipsync"
          "$relay" --help
      - name: Scripts compile
        if: matrix.platform != 'windows'
        run: |
          python3 -m py_compile scripts/e2e-brew.py scripts/check-regressions.py
          bash -n scripts/update-homebrew-formula.sh
      - name: Script regression tests
        if: matrix.platform != 'windows'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: PowerShell install script parses
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("scripts/install-windows.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
