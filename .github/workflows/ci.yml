name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: CLI smoke
        shell: bash
        run: |
          cargo build -p clipsync-cli -p clipsync-relay --locked
          bin="./target/debug/clipsync"
          relay="./target/debug/clipsync-relay"
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          if [[ -f "${relay}.exe" ]]; then relay="${relay}.exe"; fi
          "$bin" --version
          "$bin" --help | grep -q "Usage: clipsync"
          "$relay" --help
      - name: Scripts compile
        if: runner.os != 'Windows'
        run: |
          python3 -m py_compile scripts/e2e-brew.py
          bash -n scripts/update-homebrew-formula.sh

  e2e-local-relay:
    name: e2e (in-process relay)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pairing, text, file, and image e2e
        run: cargo test -p clipsync-relay --test e2e --locked -- --nocapture
