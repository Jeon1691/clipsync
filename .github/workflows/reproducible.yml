name: Linux build reproducibility

on:
  push:
    branches: [master, main]
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - '.cargo/**'
      - '**/build.rs'
      - Dockerfile
      - Dockerfile.reproducible
      - 'vendor/**'
      - scripts/check-repeatable-build.sh
      - scripts/reproduce-linux-build.sh
      - .github/workflows/reproducible.yml
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - '.cargo/**'
      - '**/build.rs'
      - Dockerfile
      - Dockerfile.reproducible
      - 'vendor/**'
      - scripts/check-repeatable-build.sh
      - scripts/reproduce-linux-build.sh
      - .github/workflows/reproducible.yml
  schedule:
    - cron: '45 18 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repeatability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux workspace reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Reconstruct independent environments and compare build outputs
        run: bash scripts/reproduce-linux-build.sh target/reproducibility-report
      - name: Retain environment, hashes, build logs and differing outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-reproducibility
          path: target/reproducibility-report/
          if-no-files-found: warn
          retention-days: 14
