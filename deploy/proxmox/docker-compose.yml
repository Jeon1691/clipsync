services:
  relay:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: "${CLIPSYNC_RELAY_IMAGE:-clipsync-relay:local}"
    container_name: clipsync-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:7600:7600"
    env_file:
      - .env
    environment:
      # The origin is local; the production proxy terminates public TLS.
      CLIPSYNC_RELAY_ALLOW_HTTP: "true"
      CLIPSYNC_RELAY_BIND: 0.0.0.0:7600
      CLIPSYNC_RELAY_PUBLIC_URL: https://clipsync.develicit.dev
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
