services:
  relay:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: clipsync-relay:latest
    container_name: clipsync-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:7600:7600"
    env_file:
      - .env
    environment:
      CLIPSYNC_RELAY_BIND: 0.0.0.0:7600
      CLIPSYNC_RELAY_PUBLIC_URL: https://clipsync.develicit.dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
